<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedInfo Assist (MVP)</title>
<style>body{font-family:system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}.c{border:1px solid #ccc;border-radius:8px;padding:.6rem;margin:.5rem 0;font-size:.9rem}.d{color:#555;font-size:.8rem}</style>
</head>
<body>
<h1>MedInfo Assist (single-PDF MVP)</h1>
<p class="d">General health education only — not medical advice. Ask your doctor. Answers cite the supplied NIDDK guide with document + page.</p>
<input id="q" style="width:80%" placeholder="e.g. What should blood glucose be before meals?">
<button onclick="ask()">Ask</button>
<div id="a"></div>
<script>
async function ask(){
  const q=document.getElementById('q').value;
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
  const j=await r.json();
  let h=`<p>${j.answer}</p>`;
  (j.citations||[]).forEach(c=>{h+=`<div class="c"><b>${c.document_title}</b> — page ${c.pdf_page}<br><span class="d">${c.excerpt}</span></div>`});
  document.getElementById('a').innerHTML=h;
}
</script>
</body></html>
